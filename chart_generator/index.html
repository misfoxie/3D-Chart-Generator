<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Analytics Column Chart Generator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-group">
        <span class="logo-icon">📊</span>
        <h1>3D Analytics Chart Studio</h1>
      </div>
      <div class="header-actions">
        <label class="btn btn-primary file-btn">
          <span>📁 Load CSV File</span>
          <input type="file" id="csvFileInput" accept=".csv" />
        </label>
        <button id="btnToggleEditor" class="btn btn-secondary">✏️ Edit Data</button>
        <button id="btnToggleSettings" class="btn btn-secondary">⚙️ Chart Settings</button>
        <div class="export-group">
          <button id="btnExportPng" class="btn btn-accent">💾 Save PNG (2x HD)</button>
          <button id="btnExportSvg" class="btn btn-outline">📐 Save SVG</button>
          <button id="btnCopyImage" class="btn btn-outline" title="Copy to clipboard">📋 Copy</button>
        </div>
      </div>
    </header>

    <div class="sub-toolbar">
      <div class="toolbar-left">
        <div class="control-pill">
          <label>Scale:</label>
          <button id="btnScaleLog" class="pill-btn active">Logarithmic (10ⁿ)</button>
          <button id="btnScaleLinear" class="pill-btn">Linear</button>
        </div>
        <div class="control-pill">
          <label>Preset:</label>
          <select id="sampleSelect">
            <option value="august_2026">August 2026 (Metadata_of_forum.csv)</option>
            <option value="top_users_august">Top Active Users (August 2026)</option>
            <option value="top_boards_august">Top Boards by Posts (August 2026)</option>
            <option value="top_words_august">Top Words (August 2026)</option>
            <option value="september_2026">September 2026 (Metadata)</option>
            <option value="july_2026">July 2026 (Metadata)</option>
          </select>
        </div>
        <div class="control-pill" id="columnSelectGroup" style="display:none;">
          <label>Category:</label>
          <select id="selectMetricCol"></select>
          <label>Value:</label>
          <select id="selectValueCol"></select>
        </div>
        <div class="control-pill" id="rowLimitGroup">
          <label>Show:</label>
          <select id="selectRowLimit">
            <option value="10">Top 10</option>
            <option value="15">Top 15</option>
            <option value="20" selected>Top 20</option>
            <option value="30">Top 30</option>
            <option value="50">Top 50</option>
            <option value="all">All</option>
          </select>
        </div>
        <div class="control-pill">
          <button id="btnShuffleColors" class="pill-btn action-pill" title="Shuffle bar colors randomly">🔀 Shuffle Colors</button>
        </div>
      </div>
      <div class="toolbar-right">
        <span class="file-info-badge" id="fileInfoBadge">Metadata_of_forum.csv (13 metrics)</span>
      </div>
    </div>

    <main class="chart-workspace">
      <div class="canvas-wrapper" id="dropZone">
        <canvas id="chartCanvas"></canvas>
        <div class="drop-overlay" id="dropOverlay">
          <div class="drop-message"><span>📥 Drop CSV file here</span></div>
        </div>
      </div>

      <!-- Slide-out Data Editor Drawer -->
      <aside class="drawer" id="dataDrawer">
        <div class="drawer-header">
          <h3>Data Table Editor</h3>
          <button class="drawer-close" id="btnCloseDrawer">&times;</button>
        </div>
        <div class="drawer-body">
          <div class="data-actions-row">
            <button id="btnAddRow" class="btn btn-sm btn-secondary">+ Add Metric</button>
            <button id="btnDrawerShuffleColors" class="btn btn-sm btn-secondary" title="Shuffle bar colors randomly">🔀 Shuffle Colors</button>
            <button id="btnResetData" class="btn btn-sm btn-outline">↺ Reset Default</button>
          </div>
          <div class="table-container">
            <table id="dataTable">
              <thead>
                <tr>
                  <th>Color</th>
                  <th>Metric (X-Axis)</th>
                  <th>Value (Y-Axis)</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="raw-csv-section">
            <details>
              <summary>Paste Raw CSV Text</summary>
              <textarea id="rawCsvText" rows="6" placeholder="metric,value..."></textarea>
              <button id="btnApplyRawCsv" class="btn btn-sm btn-primary">Apply CSV Text</button>
            </details>
          </div>
        </div>
      </aside>

      <!-- Slide-out Settings Drawer -->
      <aside class="drawer" id="settingsDrawer">
        <div class="drawer-header">
          <h3>Chart Styling & 3D Settings</h3>
          <button class="drawer-close" id="btnCloseSettings">&times;</button>
        </div>
        <div class="drawer-body">
          <div class="setting-group">
            <label>Chart Title</label>
            <input type="text" id="settingTitle" value="Metadata of forum" />
          </div>
          <div class="setting-group-row">
            <div>
              <label>Title Size</label>
              <input type="number" id="settingTitleSize" value="30" min="16" max="60" />
            </div>
            <div>
              <label>Title Style</label>
              <div class="checkbox-row">
                <label><input type="checkbox" id="settingTitleBold" checked /> Bold</label>
                <label><input type="checkbox" id="settingTitleItalic" checked /> Italic</label>
              </div>
            </div>
          </div>
          <hr class="divider">
          <h4>3D Geometry & Perspective</h4>
          <div class="setting-group">
            <label>3D Depth: <span id="depthVal">24px</span></label>
            <input type="range" id="setting3dDepth" min="8" max="50" value="24" />
          </div>
          <div class="setting-group">
            <label>Bar Width Ratio: <span id="widthVal">0.68</span></label>
            <input type="range" id="settingBarWidth" min="0.3" max="0.9" step="0.02" value="0.68" />
          </div>
          <div class="setting-group-row">
            <label><input type="checkbox" id="settingShowFloor" checked /> 3D Ground Platform</label>
            <label><input type="checkbox" id="settingShowLegend" checked /> Show Legend</label>
          </div>
          <hr class="divider">
          <h4>Axes & Gridlines</h4>
          <div class="setting-group-row">
            <label><input type="checkbox" id="settingShowLabels" checked /> Data Labels</label>
            <label><input type="checkbox" id="settingShowMinorTicks" checked /> Minor Ticks</label>
          </div>
          <div class="setting-group-row">
            <label><input type="checkbox" id="settingShowGridlines" checked /> Major Gridlines</label>
            <label><input type="checkbox" id="settingShowMinorGridlines" checked /> Minor Gridlines</label>
          </div>
          <div class="setting-group">
            <label>Category Label Angle</label>
            <select id="settingLabelAngle">
              <option value="auto" selected>Auto (Slanted if crowded)</option>
              <option value="horizontal">Horizontal (0°)</option>
              <option value="slanted">Slanted (-35°)</option>
              <option value="vertical">Vertical (-90°)</option>
            </select>
          </div>
          <div class="setting-group">
            <label>Horizontal Axis Font Size (pt)</label>
            <input type="number" id="settingHAxisSize" value="18" min="10" max="28" />
          </div>
          <div class="setting-group">
            <label>Data Label Font Size (pt)</label>
            <input type="number" id="settingLabelSize" value="18" min="10" max="28" />
          </div>
          <hr class="divider">
          <h4>Colors & Palette</h4>
          <div class="setting-group">
            <button id="btnSettingsShuffleColors" class="btn btn-secondary" style="width: 100%;">🔀 Shuffle Colors</button>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
